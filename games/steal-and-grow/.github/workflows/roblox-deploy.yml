name: Deploy to Roblox

# Fully automatic deploy: every push to the game's source publishes a new live
# version of the place. The only manual steps in the whole pipeline are the
# one-time creation of the experience and its passes (Roblox has no API for
# either) — see docs/PUBLISHING.md.
#
# Repository secrets required:
#   ROBLOX_API_KEY   Open Cloud key with the `assets` API system and
#                    Read + Write operations on this experience
#   ROBLOX_PLACE_ID  no Universe ID is needed: the Assets API addresses the
#                    place directly, and a place's asset id IS its Place ID

on:
  push:
    branches: [main]
    paths:
      - "games/steal-and-grow/src/**"
      - "games/steal-and-grow/default.project.json"
      - ".github/workflows/roblox-deploy.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar ao vivo? (false = sobe sem publicar)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/steal-and-grow
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          path: games/steal-and-grow

      - name: Lint (selene)
        continue-on-error: true
        run: selene src

      - name: Check formatting (stylua)
        continue-on-error: true
        run: stylua --check src

      - name: Build place file
        run: |
          mkdir -p build
          rojo build default.project.json --output build/StealAndGrow.rbxl
          ls -lh build/StealAndGrow.rbxl

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealAndGrow-rbxl
          path: games/steal-and-grow/build/StealAndGrow.rbxl
          retention-days: 14

      # Reuses scripts/publish.sh so the CI path and the local path cannot
      # drift apart. The script polls the async operation, so a green step
      # means the place really published, not just that the upload was accepted.
      - name: Publish to Roblox
        if: ${{ env.ROBLOX_API_KEY != '' }}
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
          PUBLISH: ${{ github.event.inputs.publish || 'true' }}
        run: |
          if [ "$PUBLISH" = "false" ]; then
            ./scripts/publish.sh --saved
          else
            ./scripts/publish.sh
          fi

      - name: Skipped publish notice
        if: ${{ env.ROBLOX_API_KEY == '' }}
        run: |
          echo "::warning::ROBLOX_API_KEY não configurado — o place foi construído"
          echo "::warning::e salvo como artifact, mas não publicado."
